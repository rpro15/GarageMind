version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MINIAPP_URL=https://your-domain.com/miniapp/
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    volumes:
      - ./app:/app  # для разработки (в проде можно убрать)
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/miniapp/static:/usr/share/nginx/html/miniapp
      - ./certs:/etc/letsencrypt  # SSL сертификаты
    depends_on:
      - api