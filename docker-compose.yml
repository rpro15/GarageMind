services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MINIAPP_URL=https://rpro.su/miniapp/
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
      - GARAGE_MIND_DB_PATH=/app/data/garage_mind.db
    depends_on:
      - redis
    volumes:
      - ./wsgi.py:/app/wsgi.py:ro
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
      - ./app:/app/app:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/miniapp/static:/usr/share/nginx/html/miniapp
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api