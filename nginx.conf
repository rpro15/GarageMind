server {
    listen 80;
    server_name rpro.su www.rpro.su;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rpro.su www.rpro.su;

    ssl_certificate /etc/letsencrypt/live/rpro.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpro.su/privkey.pem;

    location /miniapp/ {
        alias /usr/share/nginx/html/miniapp/;
        try_files $uri $uri/ /miniapp/index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}