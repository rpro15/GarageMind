<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="60%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#06060a"/>
    </radialGradient>

    <!-- Циан для AI -->
    <linearGradient id="neonAI" x1="-20%" y1="0%" x2="120%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#00ccff"/>
      <stop offset="100%" style="stop-color:#0099dd"/>
    </linearGradient>

    <!-- Бело-циан для "АВТО ЭКСПЕРТ" -->
    <linearGradient id="whiteCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0f8ff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0f0ff"/>
    </linearGradient>

    <!-- Градиент для рамки (как буквы) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="30%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#00ccff"/>
      <stop offset="70%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <filter id="faint" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
    </filter>

    <clipPath id="roundedRect">
      <rect x="0" y="0" width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- === ЯРКАЯ ОКОНТОВКА (бело-голубая, как буквы) === -->
  
  <!-- Внешнее свечение рамки -->
  <rect x="0" y="0" width="512" height="512" rx="96" 
        fill="none" stroke="rgba(0,212,255,0.08)" stroke-width="8" filter="url(#bigGlow)"/>
  
  <!-- Основная рамка -->
  <rect x="5" y="5" width="502" height="502" rx="93" 
        fill="none" stroke="url(#borderGrad)" stroke-width="3" filter="url(#softGlow)"/>
  
  <!-- Внутренняя тонкая рамка -->
  <rect x="10" y="10" width="492" height="492" rx="88" 
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- Свечение по углам рамки -->
  <circle cx="40" cy="40" r="20" fill="rgba(0,212,255,0.04)" filter="url(#bigGlow)"/>
  <circle cx="472" cy="40" r="20" fill="rgba(0,212,255,0.04)" filter="url(#bigGlow)"/>
  <circle cx="40" cy="472" r="20" fill="rgba(0,212,255,0.02)" filter="url(#bigGlow)"/>
  <circle cx="472" cy="472" r="20" fill="rgba(0,212,255,0.02)" filter="url(#bigGlow)"/>

  <!-- === ЗАПЧАСТИ НА ФОНЕ === -->
  <g opacity="0.07" filter="url(#faint)">
    <g transform="translate(60, 90)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#00d4ff"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#00d4ff" stroke-width="1.5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#00d4ff" stroke-width="1.5"/>
      <line x1="-17" y1="-17" x2="17" y2="17" stroke="#00d4ff" stroke-width="1.5"/>
      <line x1="17" y1="-17" x2="-17" y2="17" stroke="#00d4ff" stroke-width="1.5"/>
    </g>

    <g transform="translate(450, 100) rotate(45)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#00d4ff"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#00d4ff" stroke-width="1"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#00d4ff" stroke-width="1"/>
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#00d4ff" stroke-width="1"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#00d4ff" stroke-width="1"/>
    </g>

    <g transform="translate(390, 420) rotate(-20)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#00d4ff"/>
      <line x1="0" y1="-27" x2="0" y2="27" stroke="#00d4ff" stroke-width="1"/>
      <line x1="-27" y1="0" x2="27" y2="0" stroke="#00d4ff" stroke-width="1"/>
      <line x1="-19" y1="-19" x2="19" y2="19" stroke="#00d4ff" stroke-width="1"/>
      <line x1="19" y1="-19" x2="-19" y2="19" stroke="#00d4ff" stroke-width="1"/>
    </g>

    <g transform="translate(55, 430) rotate(30)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#00d4ff"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#00d4ff" stroke-width="1"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#00d4ff" stroke-width="1"/>
    </g>

    <!-- Шестерёнки (золотые) -->
    <g transform="translate(150, 60)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ffd700" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#ffd700" stroke-width="1"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffd700" stroke-width="1"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffd700" stroke-width="1"/>
    </g>

    <g transform="translate(410, 75) rotate(15)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ffd700" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#ffd700" stroke-width="0.8"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#ffd700" stroke-width="0.8"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#ffd700" stroke-width="0.8"/>
    </g>

    <!-- Гайки -->
    <g transform="translate(355, 350)">
      <polygon points="0,-8 6,-6 8,0 6,6 0,8 -6,6 -8,0 -6,-6" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="0" cy="0" r="2.5" fill="#00d4ff"/>
    </g>
    
    <g transform="translate(145, 380) rotate(22)">
      <polygon points="0,-7 5,-5 7,0 5,5 0,7 -5,5 -7,0 -5,-5" fill="none" stroke="#ffd700" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="2" fill="#ffd700"/>
    </g>

    <!-- Разводной ключ -->
    <g transform="translate(85, 310) rotate(-40)">
      <rect x="-2" y="-28" width="4" height="22" rx="1" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <path d="M -7 -32 L 7 -32 L 8 -27 L 7 -25 L -7 -25 L -8 -27 Z" fill="none" stroke="#00d4ff" stroke-width="1"/>
    </g>

    <!-- Пружина -->
    <g transform="translate(435, 290) rotate(50)">
      <rect x="-3" y="-22" width="6" height="6" rx="1" fill="none" stroke="#ffd700" stroke-width="0.8"/>
      <rect x="-3" y="-13" width="6" height="6" rx="1" fill="none" stroke="#ffd700" stroke-width="0.8"/>
      <rect x="-3" y="-4" width="6" height="6" rx="1" fill="none" stroke="#ffd700" stroke-width="0.8"/>
      <rect x="-3" y="5" width="6" height="6" rx="1" fill="none" stroke="#ffd700" stroke-width="0.8"/>
    </g>

    <!-- Выхлопная труба -->
    <g transform="translate(175, 450) rotate(-15)">
      <rect x="-4" y="-14" width="8" height="20" rx="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
      <rect x="-6" y="-17" width="12" height="5" rx="2" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
    </g>
  </g>

  <!-- === ОСНОВНОЙ КОНТЕНТ === -->

  <!-- "АВТО ЭКСПЕРТ" — белый с циан-оттенком -->
  <g transform="translate(256, 185)">
    <ellipse cx="0" cy="15" rx="180" ry="10" fill="rgba(0,212,255,0.03)" filter="url(#bigGlow)"/>
    
    <text x="0" y="0" font-family="'Montserrat', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="46" font-weight="700" fill="rgba(0,0,0,0.4)" text-anchor="middle" 
          letter-spacing="10" transform="translate(0, 3)">АВТО ЭКСПЕРТ</text>
    
    <text x="0" y="0" font-family="'Montserrat', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="46" font-weight="700" fill="url(#whiteCyan)" text-anchor="middle" 
          letter-spacing="10" filter="url(#softGlow)">АВТО ЭКСПЕРТ</text>
  </g>

  <!-- Декоративная линия под "АВТО ЭКСПЕРТ" -->
  <g transform="translate(256, 225)" opacity="0.12">
    <line x1="-140" y1="0" x2="-50" y2="0" stroke="#00d4ff" stroke-width="1" filter="url(#faint)"/>
    <line x1="50" y1="0" x2="140" y2="0" stroke="#00d4ff" stroke-width="1" filter="url(#faint)"/>
    <circle cx="0" cy="0" r="2" fill="#00d4ff" filter="url(#softGlow)"/>
  </g>

  <!-- "AI" — яркий неоновый циан -->
  <g transform="translate(256, 315)">
    <ellipse cx="0" cy="5" rx="90" ry="12" fill="rgba(0,212,255,0.06)" filter="url(#bigGlow)"/>
    
    <text x="0" y="0" font-family="'Montserrat', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="85" font-weight="800" fill="rgba(0,0,0,0.4)" text-anchor="middle" 
          letter-spacing="20" transform="translate(0, 4)">AI</text>
    
    <text x="0" y="0" font-family="'Montserrat', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="85" font-weight="800" fill="url(#neonAI)" text-anchor="middle" 
          letter-spacing="20" filter="url(#neonGlow)">AI</text>
  </g>

  <!-- Нижняя неоновая дуга -->
  <g transform="translate(256, 395)" opacity="0.05">
    <path d="M -180 0 Q 0 -50 180 0" fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#faint)"/>
  </g>

  <!-- === ДЕКОРАТИВНЫЕ АКЦЕНТЫ === -->
  
  <!-- Верхняя линия -->
  <g transform="translate(256, 105)" opacity="0.08">
    <line x1="-200" y1="0" x2="-60" y2="0" stroke="#00d4ff" stroke-width="1"/>
    <line x1="60" y1="0" x2="200" y2="0" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#00d4ff" filter="url(#softGlow)"/>
  </g>

  <!-- Частицы tech -->
  <circle cx="130" cy="115" r="1.2" fill="#00d4ff" opacity="0.1" filter="url(#faint)"/>
  <circle cx="380" cy="125" r="0.8" fill="#00d4ff" opacity="0.08"/>
  <circle cx="480" cy="300" r="1" fill="#ffd700" opacity="0.06"/>
  <circle cx="35" cy="280" r="1" fill="#ffd700" opacity="0.06"/>
</svg>
