<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Авто Эксперт AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header>
            <div class="header-top">
                <div class="brand">
                    <i class="fas fa-microchip"></i>
                    <span>Авто Эксперт <em>AI</em></span>
                </div>
                <div class="header-badge">
                    <span class="dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="header-sub">
                <i class="fas fa-robot"></i>
                <span>AI-консультант по подбору шин</span>
            </div>
        </header>

        <!-- Чат -->
        <div id="chat">
            <div id="messages"></div>
        </div>

        <!-- Панель ввода -->
        <div id="input-area">
            <button id="micBtn" class="mic-btn" title="Голосовой ввод">
                <i class="fas fa-microphone"></i>
            </button>
            <input type="text" id="chatInput" placeholder="Напишите или нажмите микрофон..." autocomplete="off">
            <button id="sendBtn" class="send-btn" title="Отправить">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <!-- Индикатор распознавания речи -->
        <div id="speechIndicator" class="hidden">
            <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
            <span>Слушаю...</span>
        </div>

        <!-- Результаты -->
        <div id="resultsOverlay" class="hidden">
            <div id="resultsPanel">
                <div class="results-header">
                    <h2><i class="fas fa-star"></i> Рекомендации</h2>
                    <button id="closeResults"><i class="fas fa-times"></i></button>
                </div>
                <div id="advice" class="advice-box"></div>
                <div id="product-list" class="product-list"></div>
                <div id="loading-results" class="hidden">
                    <div class="spinner"></div>
                    <p>Нейросеть анализирует...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
