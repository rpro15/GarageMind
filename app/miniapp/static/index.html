<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Авто Эксперт AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header>
            <div class="header-top">
                <div class="brand">
                    <i class="fas fa-microchip"></i>
                    <span>Авто Эксперт <em>AI</em></span>
                </div>
                <div class="header-actions">
                    <button id="modeToggle" class="mode-btn" title="Переключить режим">
                        <i class="fas fa-comment-dots"></i>
                    </button>
                    <div class="header-badge">
                        <span class="dot"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="header-sub" id="headerSub">
                <i class="fas fa-robot"></i>
                <span>AI-консультант по подбору шин</span>
            </div>
        </header>

        <!-- Режим 1: Чат -->
        <div id="chatMode" class="mode-panel">
            <div id="chat">
                <div id="messages"></div>
            </div>
            <div id="input-area">
                <button id="micBtn" class="mic-btn" title="Голосовой ввод">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="chatInput" placeholder="Напишите или нажмите микрофон..." autocomplete="off">
                <button id="sendBtn" class="send-btn" title="Отправить">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div id="speechIndicator" class="hidden">
                <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
                <span>Слушаю...</span>
            </div>
        </div>

        <!-- Режим 2: Форма -->
        <div id="formMode" class="mode-panel hidden">
            <form id="tireForm">
                <div class="form-group">
                    <label for="brand"><i class="fas fa-car"></i> Марка</label>
                    <select id="brand" required>
                        <option value="">Выберите марку</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model"><i class="fas fa-car-side"></i> Модель</label>
                    <select id="model" required disabled>
                        <option value="">Сначала выберите марку</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label for="year"><i class="fas fa-calendar"></i> Год</label>
                        <input type="number" id="year" placeholder="2020" min="1980" max="2026" required>
                    </div>
                    <div class="form-group half">
                        <label for="budget"><i class="fas fa-coins"></i> Бюджет (₽)</label>
                        <input type="number" id="budget" placeholder="Не обязательно">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-road"></i> Стиль вождения</label>
                    <div class="radio-group">
                        <label class="radio-btn">
                            <input type="radio" name="driving_style" value="comfort" checked>
                            <span>🚗 Комфорт</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="driving_style" value="sport">
                            <span>🏎️ Спорт</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="driving_style" value="economy">
                            <span>⛽ Эконом</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-cloud-sun"></i> Сезон</label>
                    <div class="radio-group">
                        <label class="radio-btn">
                            <input type="radio" name="season" value="summer" checked>
                            <span>☀️ Лето</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="season" value="winter">
                            <span>❄️ Зима</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="season" value="all_season">
                            <span>🌦️ Всесезон</span>
                        </label>
                    </div>
                </div>
                <button type="submit" id="submitBtn">
                    <i class="fas fa-magic"></i> Подобрать шины
                </button>
            </form>
        </div>

        <!-- Результаты (единый оверлей) -->
        <div id="resultsOverlay" class="hidden">
            <div id="resultsPanel">
                <div class="results-header">
                    <h2><i class="fas fa-star"></i> Рекомендации</h2>
                    <button id="closeResults"><i class="fas fa-times"></i></button>
                </div>
                <div id="advice" class="advice-box"></div>
                <div id="product-list" class="product-list"></div>
                <div id="loading-results" class="hidden">
                    <div class="spinner"></div>
                    <p>Нейросеть анализирует...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
