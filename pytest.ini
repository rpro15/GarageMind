[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Настройки покрытия
addopts = -v --cov=app --cov-report=term-missing --cov-report=html:coverage_report

# Маркеры
markers =
    slow: медленные тесты (docker, интеграционные)
    api: тесты API
    unit: юнит-тесты
